<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gastos por Voz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
    }

    header p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    /* Record button */
    .record-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    #recordBtn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
    }

    #recordBtn:hover { transform: scale(1.05); }

    #recordBtn.recording {
      background: linear-gradient(135deg, #ef4444, #f97316);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      70%  { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }

    #statusText {
      font-size: 0.95rem;
      color: #94a3b8;
      min-height: 22px;
    }

    #timer {
      font-size: 0.85rem;
      color: #ef4444;
      min-height: 20px;
      font-variant-numeric: tabular-nums;
    }

    /* Transcript */
    .section-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
    }

    #transcript {
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      min-height: 64px;
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Result */
    #resultBox {
      display: none;
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
    }

    #resultBox.success { border-left: 4px solid #22c55e; }
    #resultBox.error   { border-left: 4px solid #ef4444; }

    #resultBox p { font-size: 0.9rem; color: #94a3b8; }
    #resultBox strong { color: #f1f5f9; }

    /* History */
    #history {
      margin-top: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }

    .history-item:last-child { border-bottom: none; }

    .hi-left { font-size: 0.88rem; color: #cbd5e1; }
    .hi-right { font-size: 0.9rem; font-weight: 600; color: #6366f1; white-space: nowrap; margin-left: 12px; }

    .empty-history {
      text-align: center;
      color: #475569;
      font-size: 0.88rem;
      padding: 12px 0;
    }

    /* Send button */
    #sendBtn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }

    #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }
    #sendBtn:not(:disabled):hover { opacity: 0.9; }

    /* Webhook config */
    .config-toggle {
      text-align: center;
      margin-top: 20px;
    }

    .config-toggle button {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    #configPanel {
      display: none;
      margin-top: 14px;
    }

    #configPanel input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      color: #f1f5f9;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    #configPanel input::placeholder { color: #475569; }

    #saveConfigBtn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #6366f1;
      background: transparent;
      color: #6366f1;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #saveConfigBtn:hover { background: #6366f120; }
  </style>
</head>
<body>

<header>
  <h1>🎤 Gastos por Voz</h1>
  <p>Registra tus gastos hablando</p>
</header>

<div class="card">

  <!-- Record -->
  <div class="record-area">
    <button id="recordBtn" title="Mantén presionado para grabar">🎤</button>
    <span id="statusText">Toca para grabar</span>
    <span id="timer"></span>
  </div>

  <!-- Transcript -->
  <p class="section-label">Lo que dijiste</p>
  <div id="transcript">—</div>

  <!-- Send -->
  <button id="sendBtn" disabled>Registrar gasto →</button>

  <!-- Result -->
  <div id="resultBox">
    <p id="resultText"></p>
  </div>

  <!-- History -->
  <p class="section-label">Últimos registros</p>
  <div id="history"><p class="empty-history">Aún no hay registros en esta sesión</p></div>

  <!-- Webhook config -->
  <div class="config-toggle">
    <button onclick="toggleConfig()">⚙️ Configurar webhook</button>
  </div>
  <div id="configPanel">
    <input type="url" id="webhookInput" placeholder="https://tu-n8n.com/webhook/gastos-por-voz" />
    <button id="saveConfigBtn" onclick="saveConfig()">Guardar URL</button>
  </div>

</div>

<script>
  // ─── CONFIG ────────────────────────────────────────────────
  // Reemplaza con tu URL de n8n, o configúrala desde la app ↓
  let WEBHOOK_URL = localStorage.getItem('n8n_webhook') || '';

  // ─── STATE ─────────────────────────────────────────────────
  let mediaRecorder = null;
  let audioChunks   = [];
  let audioBlob     = null;
  let timerInterval = null;
  let seconds       = 0;
  const history     = [];

  // ─── ELEMENTS ──────────────────────────────────────────────
  const recordBtn   = document.getElementById('recordBtn');
  const statusText  = document.getElementById('statusText');
  const timerEl    = document.getElementById('timer');
  const transcript  = document.getElementById('transcript');
  const sendBtn     = document.getElementById('sendBtn');
  const resultBox   = document.getElementById('resultBox');
  const resultText  = document.getElementById('resultText');
  const historyEl   = document.getElementById('history');

  // ─── RECORD ────────────────────────────────────────────────
  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopRecording();
    } else {
      await startRecording();
    }
  });

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        stream.getTracks().forEach(t => t.stop());
        transcript.textContent = '🔄 Procesando audio localmente...';
        sendBtn.disabled = false;
        simulateTranscript(); // En producción: envía al webhook directamente
      };

      mediaRecorder.start();
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹';
      statusText.textContent = 'Grabando... toca para detener';
      seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = formatTime(seconds);
        if (seconds >= 60) stopRecording();
      }, 1000);

    } catch (err) {
      statusText.textContent = '❌ Sin acceso al micrófono';
      console.error(err);
    }
  }

  function stopRecording() {
    if (mediaRecorder) mediaRecorder.stop();
    clearInterval(timerInterval);
    timerEl.textContent = '';
    recordBtn.classList.remove('recording');
    recordBtn.textContent = '🎤';
    statusText.textContent = 'Toca para grabar de nuevo';
  }

  // Demo: muestra placeholder; el webhook real transcribirá el audio
  function simulateTranscript() {
    setTimeout(() => {
      transcript.textContent = '(Audio grabado — listo para enviar al webhook de n8n)';
    }, 600);
  }

  // ─── SEND ──────────────────────────────────────────────────
  sendBtn.addEventListener('click', async () => {
    if (!audioBlob) return;

    if (!WEBHOOK_URL) {
      showResult('error', '⚠️ Configura la URL del webhook primero (botón ⚙️ abajo)');
      return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = 'Enviando...';
    statusText.textContent = 'Enviando a n8n...';

    try {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'gasto.webm');
      formData.append('timestamp', new Date().toISOString());

      const res = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      let data = {};
      try { data = await res.json(); } catch (_) {}

      const label   = data.categoria   || '—';
      const monto   = data.monto       ? `S/. ${data.monto}` : '—';
      const detalle = data.descripcion || 'Gasto registrado';

      showResult('success', `✅ <strong>${detalle}</strong><br>Categoría: ${label} · ${monto}`);
      addToHistory(detalle, monto);

      transcript.textContent = data.transcripcion || transcript.textContent;
      audioBlob = null;
      sendBtn.textContent = 'Registrar gasto →';
      statusText.textContent = 'Toca para grabar';

    } catch (err) {
      showResult('error', `❌ Error al enviar: ${err.message}`);
      sendBtn.disabled = false;
      sendBtn.textContent = 'Registrar gasto →';
    }
  });

  // ─── HELPERS ───────────────────────────────────────────────
  function showResult(type, html) {
    resultBox.className = type;
    resultText.innerHTML = html;
    resultBox.style.display = 'block';
  }

  function addToHistory(desc, monto) {
    history.unshift({ desc, monto, time: new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) });
    if (history.length > 10) history.pop();
    renderHistory();
  }

  function renderHistory() {
    if (!history.length) {
      historyEl.innerHTML = '<p class="empty-history">Aún no hay registros en esta sesión</p>';
      return;
    }
    historyEl.innerHTML = history.map(h =>
      `<div class="history-item">
        <div class="hi-left">${h.time} · ${h.desc}</div>
        <div class="hi-right">${h.monto}</div>
      </div>`
    ).join('');
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
  }

  // ─── CONFIG PANEL ──────────────────────────────────────────
  function toggleConfig() {
    const p = document.getElementById('configPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
    if (p.style.display === 'block') {
      document.getElementById('webhookInput').value = WEBHOOK_URL;
    }
  }

  function saveConfig() {
    const url = document.getElementById('webhookInput').value.trim();
    if (url) {
      WEBHOOK_URL = url;
      localStorage.setItem('n8n_webhook', url);
      toggleConfig();
      showResult('success', '✅ Webhook guardado correctamente');
    }
  }
</script>
</body>
</html>
