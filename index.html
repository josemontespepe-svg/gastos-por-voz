<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Control del Bebé</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
    }

    [hidden] { display: none !important; }

    header { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p  { font-size: 0.85rem; color: #94a3b8; margin-top: 2px; }
    .icon-btn { background: #1e293b; border: none; color: #94a3b8; font-size: 1.2rem; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; }

    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      margin-bottom: 14px;
    }
    .card h2 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .card h2 .tag { margin-left: auto; font-size: 0.72rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: #0f172a; color: #94a3b8; }
    .card.activo h2 .tag { background: rgba(52,211,153,0.15); color: #34d399; }

    .big {
      width: 100%;
      min-height: 68px;
      border: none;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      transition: transform .08s, filter .15s;
    }
    .big:active { transform: scale(0.98); }
    .big:disabled { filter: grayscale(0.7) brightness(0.7); cursor: default; }
    .lact  { background: #f9a8d4; }
    .sueno { background: #a5b4fc; }
    .fin   { background: #34d399; }

    .estado { font-size: 0.9rem; color: #cbd5e1; margin: -4px 0 12px; }
    .estado b { color: #34d399; }
    .link { background: none; border: none; color: #94a3b8; font-size: 0.82rem; text-decoration: underline; cursor: pointer; margin-top: 10px; }

    .proxima-hora { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.5px; margin: -6px 0 4px; font-variant-numeric: tabular-nums; }
    #cardProxima .estado { margin-bottom: 0; }
    #cardProxima.aviso60 { box-shadow: inset 0 0 0 2px #fbbf24, 0 8px 32px rgba(0,0,0,0.3); }
    #cardProxima.aviso30 { box-shadow: inset 0 0 0 2px #fb923c, 0 8px 32px rgba(0,0,0,0.3); background: #2a2320; }
    #cardProxima.tarde   { box-shadow: inset 0 0 0 2px #f87171, 0 8px 32px rgba(0,0,0,0.3); background: #2b1f24; }
    #cardProxima.aviso60 .tag { background: rgba(251,191,36,0.15); color: #fbbf24; }
    #cardProxima.aviso30 .tag { background: rgba(251,146,60,0.18); color: #fb923c; }
    #cardProxima.tarde .tag   { background: rgba(248,113,113,0.18); color: #f87171; }
    .config label { display: block; font-size: 0.82rem; color: #94a3b8; margin: 2px 0 6px; }

    .panel { margin-top: 4px; }
    .label { font-size: 0.82rem; color: #94a3b8; margin-bottom: 8px; }
    .chips { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
    .chip {
      background: #0f172a; border: 2px solid #334155; color: #f1f5f9;
      border-radius: 12px; padding: 13px; font-size: 0.98rem; font-weight: 600; cursor: pointer; text-align: left;
    }
    .chip.on { border-color: #f9a8d4; background: rgba(249,168,212,0.12); }
    .onzas { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .onzas button { width: 52px; height: 52px; border-radius: 12px; border: none; background: #334155; color: #f1f5f9; font-size: 1.4rem; font-weight: 700; cursor: pointer; }
    .onzas input {
      flex: 1; min-width: 0; height: 52px; text-align: center; font-size: 1.3rem; font-weight: 700;
      background: #0f172a; border: 2px solid #334155; border-radius: 12px; color: #f1f5f9;
    }
    .onzas span { color: #94a3b8; font-size: 0.9rem; }

    .panales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .panal { min-height: 84px; border: none; border-radius: 16px; background: #fde68a; color: #0f172a; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .panal span { font-size: 1.6rem; }
    .panal:active { transform: scale(0.97); }

    .pendientes { width: 100%; max-width: 420px; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35); color: #fcd34d; border-radius: 14px; padding: 12px 14px; font-size: 0.88rem; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pendientes button { background: #fbbf24; color: #0f172a; border: none; border-radius: 10px; padding: 8px 12px; font-weight: 700; cursor: pointer; }

    .recientes li { list-style: none; display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .recientes li:last-child { border-bottom: none; }
    .recientes .hora { color: #94a3b8; font-variant-numeric: tabular-nums; min-width: 46px; }
    .recientes .vacio { color: #64748b; font-size: 0.88rem; }
    .mini { margin-left: auto; background: #0f172a; border: none; color: #94a3b8; font-size: 1.1rem; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; }
    .mini:disabled { opacity: 0.5; }
    .fuente { font-size: 0.76rem; color: #64748b; margin: -6px 0 4px; }

    .config input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 0.9rem; margin-bottom: 10px; }
    .config button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #818cf8; color: #0f172a; font-weight: 700; cursor: pointer; }

    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(140px);
      background: #f1f5f9; color: #0f172a; padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 0.92rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); transition: transform .25s; max-width: 90vw; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>👶 Control del Bebé</h1>
      <p id="hoy"></p>
    </div>
    <button class="icon-btn" onclick="toggleConfig()" aria-label="Configuración">⚙️</button>
  </header>

  <section class="card config" id="configPanel" hidden>
    <h2>⚙️ Configuración</h2>
    <label for="webhookInput">URL del webhook de n8n</label>
    <input type="url" id="webhookInput" placeholder="https://tu-n8n.app.n8n.cloud/webhook/bebe" />
    <label for="intervaloInput">Horas entre tomas (contadas desde que terminó la anterior)</label>
    <input type="number" id="intervaloInput" inputmode="decimal" step="0.5" min="1" max="8" value="3" />
    <button onclick="guardarConfig()">Guardar</button>
  </section>

  <div class="pendientes" id="pendientes" hidden>
    <span id="pendientesTxt"></span>
    <button onclick="vaciarPendientes(true)">Reintentar</button>
  </div>

  <!-- PRÓXIMA TOMA -->
  <section class="card" id="cardProxima">
    <h2>⏰ Próxima toma <span class="tag" id="tagProxima">—</span></h2>
    <p class="proxima-hora" id="proximaHora">—</p>
    <p class="estado" id="proximaDetalle">Registra una toma para calcular la próxima.</p>
  </section>

  <!-- LACTANCIA -->
  <section class="card" id="cardLactancia">
    <h2>🍼 Lactancia <span class="tag" id="tagLactancia">Libre</span></h2>
    <p class="estado" id="estadoLactancia" hidden></p>
    <button class="big lact" id="btnLactancia" onclick="botonLactancia()">Comenzó lactancia</button>

    <div class="panel" id="panelLactancia" hidden>
      <p class="label">¿Qué tomó?</p>
      <div class="chips">
        <button class="chip" data-tipo="Pecho" onclick="elegirTipo(this)">🤱 Pecho</button>
        <button class="chip" data-tipo="Leche materna (biberón)" onclick="elegirTipo(this)">🍼 Leche materna en biberón</button>
        <button class="chip" data-tipo="Fórmula" onclick="elegirTipo(this)">🥛 Fórmula</button>
      </div>
      <div id="bloqueOnzas" hidden>
        <p class="label">¿Cuántas onzas?</p>
        <div class="onzas">
          <button onclick="cambiarOnzas(-0.5)" aria-label="Menos">−</button>
          <input type="number" id="onzas" inputmode="decimal" step="0.5" min="0.5" max="15" value="2" />
          <button onclick="cambiarOnzas(0.5)" aria-label="Más">+</button>
          <span>oz</span>
        </div>
      </div>
      <button class="big fin" id="btnGuardarLactancia" onclick="guardarFinLactancia()" disabled>Guardar</button>
    </div>
    <button class="link" id="descartarLactancia" onclick="descartar('lactancia')" hidden>Lo toqué por error, descartar</button>
  </section>

  <!-- SUEÑO -->
  <section class="card" id="cardSueno">
    <h2>😴 Sueño <span class="tag" id="tagSueno">Despierto</span></h2>
    <p class="estado" id="estadoSueno" hidden></p>
    <button class="big sueno" id="btnSueno" onclick="botonSueno()">Se durmió</button>
    <button class="link" id="descartarSueno" onclick="descartar('sueno')" hidden>Lo toqué por error, descartar</button>
  </section>

  <!-- PAÑALES -->
  <section class="card">
    <h2>🧷 Cambio de pañal</h2>
    <div class="panales">
      <button class="panal" onclick="panal('Pipí')"><span>💧</span>Pipí</button>
      <button class="panal" onclick="panal('Popó')"><span>💩</span>Popó</button>
      <button class="panal" onclick="panal('Ambos')"><span>💧💩</span>Ambos</button>
    </div>
  </section>

  <!-- ÚLTIMOS REGISTROS -->
  <section class="card">
    <h2>🕒 Últimos registros <button class="mini" id="btnRefrescar" onclick="cargarUltimos(true)" aria-label="Actualizar">↻</button></h2>
    <p class="fuente" id="fuenteUltimos"></p>
    <ul class="recientes" id="recientes"></ul>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // Cada evento lleva un id generado en el teléfono. n8n guarda con "append or update"
  // por ese id, así que reenviar lo mismo nunca duplica filas: la cola de pendientes
  // puede reintentar sin miedo.
  const LS = { webhook: 'bebe_webhook', abiertos: 'bebe_abiertos', pendientes: 'bebe_pendientes', recientes: 'bebe_recientes',
              intervalo: 'bebe_intervalo_min', ultimaToma: 'bebe_ultima_toma', avisos: 'bebe_avisos' };
  const TZ = 'America/Lima';

  function leer(clave, porDefecto) {
    try { const v = localStorage.getItem(clave); return v ? JSON.parse(v) : porDefecto; } catch (e) { return porDefecto; }
  }
  function guardar(clave, valor) {
    try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
  }

  let webhook    = leer(LS.webhook, '');
  let abiertos   = leer(LS.abiertos, {});    // { lactancia: {id, inicio}, sueno: {id, inicio} }
  let pendientes = leer(LS.pendientes, []);  // payloads que aún no llegaron a n8n
  let recientes  = leer(LS.recientes, []);
  let finLactancia = null;                   // hora en que se tocó "Terminó", antes de elegir el tipo
  let tipoElegido  = null;
  let intervaloMin = leer(LS.intervalo, 180);  // 3 h por defecto; editable en ⚙️
  let tomaServidor = null;                     // última lactancia según el Excel: { estado, inicio, fin }

  function nuevoId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }
  function hora(iso) {
    return new Date(iso).toLocaleTimeString('es-PE', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function minutosEntre(desde, hasta) {
    return Math.max(0, Math.round((new Date(hasta).getTime() - new Date(desde).getTime()) / 60000));
  }
  function duracion(min) {
    if (min < 60) return min + ' min';
    const hh = Math.floor(min / 60), mm = min % 60;
    return mm ? hh + ' h ' + mm + ' min' : hh + ' h';
  }

  // ───────── Envío con cola de pendientes ─────────
  let enviando = false;

  function encolar(payload) {
    pendientes.push(payload);
    guardar(LS.pendientes, pendientes);
    vaciarPendientes(false);
  }

  async function post(payload) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(webhook, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      if (res.ok) return 'ok';
      // Un 4xx no se arregla reintentando (payload o URL mal): no bloquear la cola.
      if (res.status >= 400 && res.status < 500) return 'descartar';
      return 'reintentar';
    } catch (e) {
      return 'reintentar';
    } finally {
      clearTimeout(t);
    }
  }

  async function vaciarPendientes(manual) {
    if (!webhook) {
      pintarPendientes();
      if (manual) aviso('Primero configura la URL del webhook (⚙️)');
      return;
    }
    if (enviando) return;
    enviando = true;
    let descartados = 0;
    let enviados = 0;
    try {
      while (pendientes.length) {
        const r = await post(pendientes[0]);
        if (r === 'reintentar') break;
        if (r === 'descartar') descartados++;
        if (r === 'ok') enviados++;
        pendientes.shift();
        guardar(LS.pendientes, pendientes);
      }
    } finally {
      enviando = false;
      pintarPendientes();
      if (enviados) cargarUltimos(false);
      if (descartados) aviso('⚠️ ' + descartados + ' registro(s) rechazados por n8n. Revisa la URL.');
      else if (manual && !pendientes.length) aviso('✅ Todo enviado');
      else if (manual) aviso('Sin conexión con n8n, se reintentará solo');
    }
  }

  function pintarPendientes() {
    const box = document.getElementById('pendientes');
    if (!pendientes.length) { box.hidden = true; return; }
    box.hidden = false;
    document.getElementById('pendientesTxt').textContent =
      '⏳ ' + pendientes.length + (pendientes.length === 1 ? ' registro sin enviar' : ' registros sin enviar');
  }

  // ───────── Lactancia ─────────
  function botonLactancia() {
    if (!abiertos.lactancia) {
      iniciar('lactancia', '🍼', 'Comenzó lactancia');
      return;
    }
    // Se congela la hora de fin AHORA: elegir tipo y onzas puede tomar un rato.
    finLactancia = new Date().toISOString();
    tipoElegido = null;
    document.querySelectorAll('#panelLactancia .chip').forEach(c => c.classList.remove('on'));
    document.getElementById('bloqueOnzas').hidden = true;
    document.getElementById('btnGuardarLactancia').disabled = true;
    pintar();
  }

  function elegirTipo(el) {
    document.querySelectorAll('#panelLactancia .chip').forEach(c => c.classList.remove('on'));
    el.classList.add('on');
    tipoElegido = el.dataset.tipo;
    document.getElementById('bloqueOnzas').hidden = (tipoElegido === 'Pecho');
    document.getElementById('btnGuardarLactancia').disabled = false;
  }

  function cambiarOnzas(delta) {
    const input = document.getElementById('onzas');
    const v = Math.min(15, Math.max(0.5, (parseFloat(input.value) || 0) + delta));
    input.value = v;
  }

  function guardarFinLactancia() {
    const a = abiertos.lactancia;
    if (!a || !tipoElegido) return;
    let onzas = null;
    if (tipoElegido !== 'Pecho') {
      onzas = parseFloat(document.getElementById('onzas').value);
      if (!(onzas > 0 && onzas <= 15)) { aviso('Ingresa las onzas (entre 0.5 y 15)'); return; }
    }
    const fin = finLactancia || new Date().toISOString();
    encolar({ evento: 'lactancia', accion: 'fin', id: a.id, inicio: a.inicio, fin: fin, tipo: tipoElegido, onzas: onzas });
    guardar(LS.ultimaToma, fin);

    const detalle = tipoElegido + (onzas ? ' · ' + onzas + ' oz' : '') + ' · ' + duracion(minutosEntre(a.inicio, fin));
    agregarReciente('🍼', 'Terminó lactancia — ' + detalle, fin);
    aviso('✅ Lactancia guardada: ' + detalle);

    delete abiertos.lactancia;
    guardar(LS.abiertos, abiertos);
    finLactancia = null;
    tipoElegido = null;
    pintar();
  }

  // ───────── Sueño ─────────
  function botonSueno() {
    if (!abiertos.sueno) { iniciar('sueno', '😴', 'Se durmió'); return; }
    const a = abiertos.sueno;
    const fin = new Date().toISOString();
    encolar({ evento: 'sueno', accion: 'fin', id: a.id, inicio: a.inicio, fin: fin });
    const d = duracion(minutosEntre(a.inicio, fin));
    agregarReciente('☀️', 'Se despertó — durmió ' + d, fin);
    aviso('✅ Sueño guardado: ' + d);
    delete abiertos.sueno;
    guardar(LS.abiertos, abiertos);
    pintar();
  }

  // ───────── Comunes ─────────
  function iniciar(evento, icono, texto) {
    const id = nuevoId();
    const inicio = new Date().toISOString();
    abiertos[evento] = { id: id, inicio: inicio };
    guardar(LS.abiertos, abiertos);
    encolar({ evento: evento, accion: 'inicio', id: id, inicio: inicio });
    agregarReciente(icono, texto, inicio);
    aviso('✅ ' + texto + ' · ' + hora(inicio));
    pintar();
  }

  function descartar(evento) {
    const a = abiertos[evento];
    if (!a) return;
    const nombre = evento === 'lactancia' ? 'la lactancia' : 'el sueño';
    if (!confirm('¿Descartar ' + nombre + ' que empezó a las ' + hora(a.inicio) + '?')) return;
    encolar({ evento: evento, accion: 'cancelar', id: a.id, inicio: a.inicio });
    agregarReciente('↩️', 'Descartado: ' + nombre + ' de las ' + hora(a.inicio), new Date().toISOString());
    delete abiertos[evento];
    guardar(LS.abiertos, abiertos);
    if (evento === 'lactancia') { finLactancia = null; tipoElegido = null; }
    pintar();
  }

  function panal(contenido) {
    const id = nuevoId();
    const fechaHora = new Date().toISOString();
    encolar({ evento: 'panal', accion: 'registro', id: id, fecha_hora: fechaHora, contenido: contenido });
    agregarReciente('🧷', 'Pañal: ' + contenido, fechaHora);
    aviso('✅ Pañal registrado: ' + contenido + ' · ' + hora(fechaHora));
  }

  function agregarReciente(icono, texto, iso) {
    recientes.unshift({ icono: icono, texto: texto, iso: iso });
    recientes = recientes.slice(0, 15);
    guardar(LS.recientes, recientes);
    pintarRecientes();
  }

  // ───────── Pintado ─────────
  function pintar() {
    const hoy = new Date().toLocaleDateString('es-PE', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('hoy').textContent = hoy.charAt(0).toUpperCase() + hoy.slice(1);
    const ahora = new Date().toISOString();

    // Lactancia
    const l = abiertos.lactancia;
    const enPanel = !!(l && finLactancia);
    document.getElementById('cardLactancia').classList.toggle('activo', !!l);
    document.getElementById('tagLactancia').textContent = l ? (enPanel ? 'Terminando' : 'En curso') : 'Libre';
    const eL = document.getElementById('estadoLactancia');
    eL.hidden = !l;
    if (l) eL.innerHTML = 'Desde las <b>' + hora(l.inicio) + '</b> · ' + duracion(minutosEntre(l.inicio, finLactancia || ahora));
    const bL = document.getElementById('btnLactancia');
    bL.textContent = l ? 'Terminó lactancia' : 'Comenzó lactancia';
    bL.className = 'big ' + (l ? 'fin' : 'lact');
    bL.hidden = enPanel;
    document.getElementById('panelLactancia').hidden = !enPanel;
    document.getElementById('descartarLactancia').hidden = !l;

    // Sueño
    const s = abiertos.sueno;
    document.getElementById('cardSueno').classList.toggle('activo', !!s);
    document.getElementById('tagSueno').textContent = s ? 'Durmiendo' : 'Despierto';
    const eS = document.getElementById('estadoSueno');
    eS.hidden = !s;
    if (s) eS.innerHTML = 'Desde las <b>' + hora(s.inicio) + '</b> · ' + duracion(minutosEntre(s.inicio, ahora));
    const bS = document.getElementById('btnSueno');
    bS.textContent = s ? 'Se despertó' : 'Se durmió';
    bS.className = 'big ' + (s ? 'fin' : 'sueno');
    document.getElementById('descartarSueno').hidden = !s;

    pintarProxima();
    pintarPendientes();
    pintarRecientes();
  }

  // ───────── Últimos registros (leídos del Excel vía n8n) ─────────
  // Muestra lo que REALMENTE quedó guardado, así se valida desde cualquiera de los dos celulares.
  // Si n8n no responde, cae a lo registrado en este teléfono y lo dice.
  let ultimosServidor = null;
  let cargandoUltimos = false;

  function urlUltimos() {
    return webhook ? webhook.replace(/\/+$/, '') + '-ultimos?n=50' : '';
  }

  async function cargarUltimos(manual) {
    const url = urlUltimos();
    if (!url) { pintarRecientes(); return; }
    if (cargandoUltimos) return;
    cargandoUltimos = true;
    const btn = document.getElementById('btnRefrescar');
    btn.disabled = true;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      ultimosServidor = Array.isArray(data.registros) ? data.registros : [];
      tomaServidor = extraerToma(ultimosServidor);
      if (manual) aviso('✅ Actualizado desde el Excel');
    } catch (e) {
      ultimosServidor = null;
      if (manual) aviso('No se pudo leer el Excel, muestro lo de este celular');
    } finally {
      clearTimeout(t);
      cargandoUltimos = false;
      btn.disabled = false;
      pintarRecientes();
      pintarProxima();
    }
  }

  function textoRegistro(r) {
    if (r.tipo === 'panal') return { icono: '🧷', texto: 'Pañal: ' + (r.detalle || '') };
    const dur = (typeof r.duracion_min === 'number') ? ' · ' + duracion(r.duracion_min) : '';
    if (r.tipo === 'lactancia') {
      if (r.estado === 'En curso') return { icono: '🍼', texto: 'Lactancia en curso' };
      if (r.estado === 'Descartada') return { icono: '↩️', texto: 'Lactancia descartada' };
      return { icono: '🍼', texto: 'Lactancia · ' + (r.detalle || '') + (r.onzas ? ' ' + r.onzas + ' oz' : '') + dur };
    }
    if (r.estado === 'En curso') return { icono: '😴', texto: 'Durmiendo' };
    if (r.estado === 'Descartada') return { icono: '↩️', texto: 'Sueño descartado' };
    return { icono: '☀️', texto: 'Sueño' + dur };
  }

  function pintarRecientes() {
    const ul = document.getElementById('recientes');
    const fuente = document.getElementById('fuenteUltimos');
    ul.innerHTML = '';
    const desdeExcel = Array.isArray(ultimosServidor);
    fuente.textContent = desdeExcel
      ? 'Guardado en el Excel'
      : (webhook ? 'Sin conexión con el Excel · solo lo de este celular' : 'Registrado en este celular');

    const hoyLima = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    const items = desdeExcel
      ? ultimosServidor.slice(0, 5).map(r => {
          const t = textoRegistro(r);
          const dia = (r.fecha && r.fecha !== hoyLima && /^\d{4}-\d{2}-\d{2}$/.test(r.fecha)) ? r.fecha.slice(8, 10) + '/' + r.fecha.slice(5, 7) + ' ' : '';
          return { icono: t.icono, texto: t.texto, cuando: dia + (r.hora || '') };
        })
      : recientes.slice(0, 5).map(r => ({ icono: r.icono, texto: r.texto, cuando: hora(r.iso) }));

    if (!items.length) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="vacio">Todavía no hay registros.</span>';
      ul.appendChild(li);
      return;
    }
    for (const it of items) {
      const li = document.createElement('li');
      const hs = document.createElement('span'); hs.className = 'hora'; hs.textContent = it.cuando;
      const ts = document.createElement('span'); ts.textContent = it.icono + ' ' + it.texto;
      li.appendChild(hs); li.appendChild(ts);
      ul.appendChild(li);
    }
  }

  // ───────── Próxima toma ─────────
  // Última lactancia del Excel (la lista viene de la más reciente a la más antigua).
  // Las horas del Excel están en hora de Lima: UTC-5 todo el año, Perú no usa horario de verano.
  function extraerToma(registros) {
    const r = (registros || []).find(x => x.tipo === 'lactancia' && x.estado !== 'Descartada');
    if (!r || !/^\d{4}-\d{2}-\d{2}$/.test(r.fecha || '') || !/^\d{2}:\d{2}$/.test(r.hora || '')) return null;
    const inicio = new Date(r.fecha + 'T' + r.hora + ':00-05:00');
    let fin = null;
    if (r.estado === 'Terminada' && /^\d{2}:\d{2}$/.test(r.hora_fin || '')) {
      fin = new Date(r.fecha + 'T' + r.hora_fin + ':00-05:00');
      if (fin < inicio) fin = new Date(fin.getTime() + 86400000);  // terminó pasada la medianoche
    }
    return { estado: r.estado, inicio: inicio, fin: fin };
  }

  function pintarProxima() {
    const card = document.getElementById('cardProxima');
    const tag = document.getElementById('tagProxima');
    const horaEl = document.getElementById('proximaHora');
    const det = document.getElementById('proximaDetalle');
    card.classList.remove('aviso60', 'aviso30', 'tarde');

    // ¿Está tomando ahora? En este celular, o según el Excel si empezó después de la última que terminó aquí.
    const finLocalIso = leer(LS.ultimaToma, null);
    const finLocal = finLocalIso ? new Date(finLocalIso) : null;
    const s = tomaServidor;
    if (abiertos.lactancia || (s && s.estado === 'En curso' && (!finLocal || s.inicio > finLocal))) {
      const desde = abiertos.lactancia ? abiertos.lactancia.inicio : s.inicio.toISOString();
      tag.textContent = 'En curso';
      horaEl.textContent = 'Tomando ahora';
      det.textContent = 'Empezó a las ' + hora(desde) + '. La próxima se calcula al terminar.';
      return;
    }

    // Base: la toma que terminó más recientemente, sea de este celular o del Excel.
    let fin = finLocal;
    if (s && s.fin && (!fin || s.fin > fin)) fin = s.fin;
    if (!fin || isNaN(fin.getTime())) {
      tag.textContent = '—';
      horaEl.textContent = '—';
      det.textContent = 'Registra una toma para calcular la próxima.';
      return;
    }

    const proxima = new Date(fin.getTime() + intervaloMin * 60000);
    const faltan = Math.round((proxima.getTime() - Date.now()) / 60000);
    horaEl.textContent = hora(proxima.toISOString());
    const base = duracion(intervaloMin) + ' desde que terminó a las ' + hora(fin.toISOString());

    if (faltan <= 0) {
      card.classList.add('tarde');
      tag.textContent = faltan === 0 ? 'Le toca ya' : 'Hace ' + duracion(-faltan);
      det.textContent = 'Ya le toca · ' + base;
    } else if (faltan <= 30) {
      card.classList.add('aviso30');
      tag.textContent = '🔔 En ' + duracion(faltan);
      det.textContent = 'Faltan menos de 30 min · ' + base;
    } else if (faltan <= 60) {
      card.classList.add('aviso60');
      tag.textContent = '⚠️ En ' + duracion(faltan);
      det.textContent = 'Falta menos de 1 hora · ' + base;
    } else {
      tag.textContent = 'En ' + duracion(faltan);
      det.textContent = base;
    }
    revisarAvisos(faltan, fin.toISOString() + '|' + intervaloMin);
  }

  // Avisos DENTRO de la app (solo si está abierta): 1 h antes, 30 min antes y a la hora.
  // Se recuerda cuáles ya salieron para esa toma, así no se repiten en cada refresco.
  function revisarAvisos(faltan, clave) {
    const av = leer(LS.avisos, {});
    if (av.clave !== clave) { av.clave = clave; av.hechos = []; }
    const umbrales = [
      { min: 0,  txt: '🍼 Ya le toca la toma' },
      { min: 30, txt: '🔔 Faltan 30 min para la próxima toma' },
      { min: 60, txt: '⚠️ Falta 1 hora para la próxima toma' }
    ];
    const toca = umbrales.find(u => faltan <= u.min && !av.hechos.includes(u.min));
    if (!toca) return;
    umbrales.forEach(u => { if (u.min >= toca.min && !av.hechos.includes(u.min)) av.hechos.push(u.min); });
    guardar(LS.avisos, av);
    aviso(toca.txt, 8000);
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  }

  let toastTimer = null;
  function aviso(txt, ms) {
    const t = document.getElementById('toast');
    t.textContent = txt;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 3200);
  }

  // ───────── Configuración ─────────
  function toggleConfig() {
    const p = document.getElementById('configPanel');
    p.hidden = !p.hidden;
    if (!p.hidden) {
      document.getElementById('webhookInput').value = webhook;
      document.getElementById('intervaloInput').value = intervaloMin / 60;
    }
  }
  function guardarConfig() {
    const url = document.getElementById('webhookInput').value.trim();
    if (url && !/^https?:\/\//i.test(url)) { aviso('La URL debe empezar con https://'); return; }
    const horas = parseFloat(String(document.getElementById('intervaloInput').value).replace(',', '.'));
    if (!(horas >= 1 && horas <= 8)) { aviso('Las horas entre tomas deben estar entre 1 y 8'); return; }
    webhook = url;
    guardar(LS.webhook, webhook);
    intervaloMin = Math.round(horas * 60);
    guardar(LS.intervalo, intervaloMin);
    document.getElementById('configPanel').hidden = true;
    aviso('✅ Configuración guardada');
    ultimosServidor = null;
    vaciarPendientes(false);
    cargarUltimos(false);
    pintarProxima();
  }

  // ───────── Arranque ─────────
  pintar();
  if (!webhook) document.getElementById('configPanel').hidden = false;
  vaciarPendientes(false);
  cargarUltimos(false);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cargarUltimos(false); });
  setInterval(pintar, 30000);                       // refresca los contadores de duración
  setInterval(() => vaciarPendientes(false), 60000);
  window.addEventListener('online', () => vaciarPendientes(false));
</script>
